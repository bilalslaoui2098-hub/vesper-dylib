name: Build Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [macos-13, macos-14]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH
          $THEOS/bin/dm.pl || true

      - name: Install ldid
        run: |
          brew install ldid || true
          echo "Using ldid: $(which ldid)"

      - name: Install ccache
        run: brew install ccache

      - name: Cache Theos SDK
        uses: actions/cache@v4
        with:
          path: ${{ env.THEOS }}/sdks
          key: theos-sdks-${{ runner.os }}-v1

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Build
        run: |
          make clean || true
          make package FINALPACKAGE=1 DEBUG=0
        env:
          THEOS: ${{ env.THEOS }}

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: vesper-deb
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30
          
